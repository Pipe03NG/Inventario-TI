<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventario TI — Equipos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="bg-gray-100 min-h-screen font-sans">

  <!-- NAV -->
  <nav class="bg-blue-700 text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-laptop text-2xl"></i>
        <span class="text-xl font-bold tracking-tight">Inventario TI</span>
      </div>
      <div class="flex gap-4 text-sm font-medium">
        <a href="/" class="hover:bg-blue-600 px-3 py-1.5 rounded-lg flex items-center gap-2 transition">
          <i class="fa-solid fa-gauge-high"></i> Dashboard
        </a>
        <a href="/usuarios-page" class="hover:bg-blue-600 px-3 py-1.5 rounded-lg flex items-center gap-2 transition">
          <i class="fa-solid fa-users"></i> Usuarios
        </a>
        <a href="/equipos-page" class="bg-blue-900 px-3 py-1.5 rounded-lg flex items-center gap-2">
          <i class="fa-solid fa-desktop"></i> Equipos
        </a>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 py-8">

    <div class="mb-8">
      <h1 class="text-3xl font-bold text-gray-800">Gestión de Equipos</h1>
      <p class="text-gray-500 mt-1">Registra y administra los equipos de cómputo</p>
    </div>

    <div class="grid lg:grid-cols-3 gap-8">

      <!-- FORMULARIO -->
      <div class="lg:col-span-1">
        <div class="bg-white rounded-2xl shadow p-6 sticky top-6">
          <h2 id="form-titulo" class="text-lg font-semibold text-gray-700 mb-5 flex items-center gap-2">
            <i class="fa-solid fa-circle-plus text-blue-500"></i>
            Nuevo Equipo
          </h2>
          <form id="form-equipo" class="space-y-4" novalidate>
            <input type="hidden" id="equipo-id" value="" />

            <div>
              <label class="block text-sm text-gray-500 mb-1">Tipo de equipo <span class="text-red-500">*</span></label>
              <select id="e-tipo"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
                required>
                <option value="">— Selecciona —</option>
                <option value="Laptop">Laptop</option>
                <option value="Desktop">Desktop</option>
                <option value="Monitor">Monitor</option>
              </select>
            </div>
            <div>
              <label class="block text-sm text-gray-500 mb-1">Marca <span class="text-red-500">*</span></label>
              <input id="e-marca" type="text" placeholder="Ej: Dell, HP, Lenovo"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
                required />
            </div>
            <div>
              <label class="block text-sm text-gray-500 mb-1">Modelo <span class="text-red-500">*</span></label>
              <input id="e-modelo" type="text" placeholder="Ej: Latitude 5530"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
                required />
            </div>
            <div>
              <label class="block text-sm text-gray-500 mb-1">Número de serie <span class="text-red-500">*</span></label>
              <input id="e-serie" type="text" placeholder="Ej: SN-20240001"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
                required />
            </div>
            <div>
              <label class="block text-sm text-gray-500 mb-1">Estado <span class="text-red-500">*</span></label>
              <select id="e-estado"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
                required>
                <option value="">— Selecciona —</option>
                <option value="Nuevo">Nuevo</option>
                <option value="Usado">Usado</option>
                <option value="En reparación">En reparación</option>
              </select>
            </div>

            <div class="flex gap-3 pt-2">
              <button type="submit"
                class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-sm font-semibold transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-floppy-disk"></i>
                <span id="btn-submit-txt">Guardar</span>
              </button>
              <button type="button" onclick="cancelarEdicion()"
                id="btn-cancelar"
                class="hidden px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-lg text-sm font-semibold transition">
                Cancelar
              </button>
            </div>
            <p id="msg-form" class="text-sm hidden"></p>
          </form>
        </div>
      </div>

      <!-- TABLA -->
      <div class="lg:col-span-2">
        <div class="bg-white rounded-2xl shadow">
          <div class="p-5 border-b border-gray-100 flex items-center justify-between">
            <h2 class="text-lg font-semibold text-gray-700">
              Equipos en inventario
              <span id="count-badge" class="ml-2 text-xs bg-blue-100 text-blue-700 font-bold px-2 py-0.5 rounded-full">0</span>
            </h2>
            <button onclick="cargarEquipos()" class="text-sm text-blue-600 hover:underline flex items-center gap-1">
              <i class="fa-solid fa-arrows-rotate"></i> Actualizar
            </button>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-gray-50 text-gray-500 uppercase text-xs">
                <tr>
                  <th class="px-5 py-3 text-left">Tipo</th>
                  <th class="px-5 py-3 text-left">Marca / Modelo</th>
                  <th class="px-5 py-3 text-left">N° Serie</th>
                  <th class="px-5 py-3 text-left">Estado</th>
                  <th class="px-5 py-3 text-left">Acciones</th>
                </tr>
              </thead>
              <tbody id="tbody-equipos" class="divide-y divide-gray-100">
                <tr>
                  <td colspan="5" class="px-5 py-10 text-center text-gray-400">
                    <i class="fa-solid fa-spinner fa-spin mr-2"></i>Cargando...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="/static/js/app.js"></script>
  <script>
    let modoEdicion = false;

    const TIPO_ICONOS = {
      'Laptop':  '<i class="fa-solid fa-laptop text-blue-400 text-base"></i>',
      'Desktop': '<i class="fa-solid fa-computer text-indigo-400 text-base"></i>',
      'Monitor': '<i class="fa-solid fa-display text-teal-400 text-base"></i>',
    };

    const ESTADO_BADGE = {
      'Nuevo':         'bg-blue-100 text-blue-700',
      'Usado':         'bg-gray-100 text-gray-600',
      'En reparación': 'bg-red-100 text-red-600',
    };

    // ── Cargar tabla ─────────────────────────────────────────────
    async function cargarEquipos() {
      try {
        const equipos = await apiFetch('/api/equipos');
        document.getElementById('count-badge').textContent = equipos.length;
        const tbody = document.getElementById('tbody-equipos');

        if (!equipos.length) {
          tbody.innerHTML = `<tr><td colspan="5" class="px-5 py-10 text-center text-gray-400">
            <i class="fa-solid fa-box-open mr-2"></i>No hay equipos registrados
          </td></tr>`;
          return;
        }

        tbody.innerHTML = equipos.map(eq => {
          const icono  = TIPO_ICONOS[eq.tipo] || '';
          const bCls   = ESTADO_BADGE[eq.estado] || 'bg-gray-100 text-gray-600';
          return `<tr class="hover:bg-gray-50 transition">
            <td class="px-5 py-3">
              <span class="flex items-center gap-2 font-medium text-gray-700">
                ${icono} ${eq.tipo}
              </span>
            </td>
            <td class="px-5 py-3">
              <div class="font-medium text-gray-800">${eq.marca}</div>
              <div class="text-xs text-gray-400">${eq.modelo}</div>
            </td>
            <td class="px-5 py-3 font-mono text-xs text-gray-600">${eq.numero_serie}</td>
            <td class="px-5 py-3">
              <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${bCls}">${eq.estado}</span>
            </td>
            <td class="px-5 py-3">
              <div class="flex gap-2">
                <button onclick="editarEquipo(${eq.id}, '${escHtml(eq.tipo)}', '${escHtml(eq.marca)}', '${escHtml(eq.modelo)}', '${escHtml(eq.numero_serie)}', '${escHtml(eq.estado)}')"
                  class="text-blue-500 hover:text-blue-700 text-xs px-2 py-1 bg-blue-50 hover:bg-blue-100 rounded-lg transition">
                  <i class="fa-solid fa-pen"></i> Editar
                </button>
                <button onclick="eliminarEquipo(${eq.id}, '${escHtml(eq.marca)} ${escHtml(eq.modelo)}')"
                  class="text-red-500 hover:text-red-700 text-xs px-2 py-1 bg-red-50 hover:bg-red-100 rounded-lg transition">
                  <i class="fa-solid fa-trash"></i> Eliminar
                </button>
              </div>
            </td>
          </tr>`;
        }).join('');
      } catch (e) {
        console.error(e);
      }
    }

    // ── Guardar ──────────────────────────────────────────────────
    document.getElementById('form-equipo').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id    = document.getElementById('equipo-id').value;
      const datos = {
        tipo:         document.getElementById('e-tipo').value,
        marca:        document.getElementById('e-marca').value.trim(),
        modelo:       document.getElementById('e-modelo').value.trim(),
        numero_serie: document.getElementById('e-serie').value.trim(),
        estado:       document.getElementById('e-estado').value,
      };
      const msg = document.getElementById('msg-form');

      try {
        if (modoEdicion && id) {
          await apiFetch(`/api/equipos/${id}`, 'PUT', datos);
          mostrarMensaje(msg, '✅ Equipo actualizado', 'text-green-600');
        } else {
          await apiFetch('/api/equipos', 'POST', datos);
          mostrarMensaje(msg, '✅ Equipo registrado correctamente', 'text-green-600');
        }
        cancelarEdicion();
        await cargarEquipos();
      } catch (err) {
        mostrarMensaje(msg, `❌ ${err.message}`, 'text-red-600');
      }
    });

    // ── Editar ───────────────────────────────────────────────────
    function editarEquipo(id, tipo, marca, modelo, serie, estado) {
      modoEdicion = true;
      document.getElementById('equipo-id').value  = id;
      document.getElementById('e-tipo').value     = tipo;
      document.getElementById('e-marca').value    = marca;
      document.getElementById('e-modelo').value   = modelo;
      document.getElementById('e-serie').value    = serie;
      document.getElementById('e-estado').value   = estado;
      document.getElementById('form-titulo').innerHTML =
        '<i class="fa-solid fa-pen-to-square text-amber-500"></i> Editar Equipo';
      document.getElementById('btn-submit-txt').textContent = 'Actualizar';
      document.getElementById('btn-cancelar').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelarEdicion() {
      modoEdicion = false;
      document.getElementById('form-equipo').reset();
      document.getElementById('equipo-id').value = '';
      document.getElementById('form-titulo').innerHTML =
        '<i class="fa-solid fa-circle-plus text-blue-500"></i> Nuevo Equipo';
      document.getElementById('btn-submit-txt').textContent = 'Guardar';
      document.getElementById('btn-cancelar').classList.add('hidden');
      document.getElementById('msg-form').classList.add('hidden');
    }

    // ── Eliminar ─────────────────────────────────────────────────
    async function eliminarEquipo(id, nombre) {
      if (!confirm(`¿Eliminar el equipo "${nombre}"? Esta acción no se puede deshacer.`)) return;
      try {
        await apiFetch(`/api/equipos/${id}`, 'DELETE');
        await cargarEquipos();
      } catch (err) {
        alert('No se pudo eliminar: ' + err.message);
      }
    }

    // ── Helpers ──────────────────────────────────────────────────
    function mostrarMensaje(el, texto, cls) {
      el.textContent = texto;
      el.className = `text-sm ${cls}`;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 4000);
    }

    function escHtml(str) {
      return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    cargarEquipos();
  </script>
</body>
</html>
